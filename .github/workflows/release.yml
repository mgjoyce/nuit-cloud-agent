name: release
# Push a tag such as v0.2.9 to publish a release: both static binaries, SHA256SUMS, and a keyless cosign signature over
# SHA256SUMS (the bundle records the certificate, which names this workflow and tag, and the public transparency-log entry).
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release
  id-token: write   # the short-lived OIDC identity cosign signs with

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - run: make build VERSION="${GITHUB_REF_NAME#v}"
      - uses: sigstore/cosign-installer@v3
      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            dist/nuit-cloud-agent-linux-amd64 dist/nuit-cloud-agent-linux-arm64 dist/SHA256SUMS dist/SHA256SUMS.sigstore.json dist/VERSION
